# kami-keeper — example `books:` fragment: one `harvestAndFeed` book (placeholders).
#
# Not a complete config. Under the `fleet` profile, merge the `books:` entry
# into keeper.yaml (books declared in a file are served under `fleet` only);
# under `lab`, send the same {account, strategyType, config} with `start`.
# Labels only, never a key value; the account must hold a grant. Every key
# that has a default is set to it (keeper/schemas/defaults.lock.json); keys
# without a default are marked `# required:` or shown commented out. Indices
# are placeholders. `describe --type harvestAndFeed` serves each key's description.
books:
- account: alice
  strategyType: harvestAndFeed
  config:
    kamiIndex: 201  # required: the one kami the book owns
    nodeIndex: 2  # required: the node the book's kamis harvest on
    # accountIndex: 1002  # the account's on-chain index (party / node / preview reads take it)
    foodItem: 11301  # required: food item index fed from inventory
    # foodLadder: [11301, 11302]  # optional: food items for ladder mode (feed size chosen every tick)
    ladderMinFloorPct: 60  # ladder mode: lowest no-waste floor, % of max HP
    dipCapMode: flat  # ladder mode: flat | measured (measured reads <dataDir>/watchlist.json)
    dipWindowDays: 7  # dipCapMode measured: kill window of a listed kami, days
    dipMeasuredMinPct: 30  # dipCapMode measured: lowest floor, % of max HP
    watchRefreshSec: 3600  # dipCapMode measured: re-read age of a listed kami's thresholds
    watchPreviewsPerTick: 5  # dipCapMode measured: listed-kami reads per tick pass and node
    watchlistMaxAgeSec: 86400  # dipCapMode measured: maximum age of the watchlist file
    maxOverhealHp: 25  # ladder mode: HP a feed may overheal when the bound rises
    tierUpCooldownSec: 3600  # ladder mode: seconds between two steps up the ladder
    foodLowUnits: 100  # ladder mode: stock below this is listed as foodLow
    friends: []  # account indices whose kamis are listed, never previewed
    safetyMarginPct: 5  # HP % kept above the served threshold of a killed-here owner
    passiveMarginPct: 2  # HP % kept above the served threshold of a threshold-no-kill owner
    passiveOwnersBind: true  # whether a threshold-no-kill owner's thresholds bind
    hostileWindowHours: 48  # window after a liquidate or cast in which its owner reads killed-here
    restFloorPct: 10  # at or below this % of max HP a kami is rested or fed whatever the bound
    cooldownHorizonSec: 600  # an attacker on a longer cooldown is not counted this tick
    previewRefreshSec: 3600  # age at which a positive threshold preview is fetched again
    previewsPerTick: 10  # preview reads per tick pass and node
    previewPolicy: all  # all | killed-here: which present attackers are previewed
    nodeCensus: vitals  # vitals | plain: the node read that lists the occupants
    attackerVitalsPerTick: 10  # nodeCensus plain: per-attacker kami reads per tick pass and node
    logScanBlocks: 40  # blocks per eth_getLogs request of the kill scan
    killScanOverlapBlocks: 12  # blocks behind the scan cursor re-read every pass
    occupantMemoryBlocks: 120  # blocks a census-listed kami stays resolvable as an occupant
    feedMode: hp  # hp: feed below feedBelowHp; interval: feed every feedInterval
    feedBelowHp: 100  # required: feedMode hp: absolute HP floor
    feedInterval: 3600  # feedMode interval: feed period, seconds
    # collectEvery: 129600  # optional: a fixed collect period, seconds (replaces the window)
    collectEveryMinSec: 108000  # collect interval drawn uniformly in [min, max], seconds
    collectEveryMaxSec: 144000  # upper end of the collect window, seconds
    # reviveItems: [11001]  # ordered revive items, inventory only
    reviveRetrySec: 200  # seconds before a still-DEAD kami is offered a revive again
    failsafeRest: true  # stop the harvest when no food can be fed
    resumeHpPct: 100  # a resting kami is redeployed at or above this % of max HP
    feedCooldownSec: 300  # a fed kami is not fed again until the feed shows or this elapses
    staleFeedCooldownSec: 1800  # under a stale lens: at most one feed per kami per this many seconds
    chainFallback: true  # read the book's kamis from the chain while the lens is down
    chainFallbackAfterSec: 300  # lens outage length before the first chain read
    chainFeedCooldownSec: 1800  # chain fallback: at most one action per kami per this many seconds
    poolStopsAcrossBooks: false  # false = stops go out in the book's own burst; true = joined with the same account's books on the node
    killForcesTick: false  # false = a kill is assessed at the book's next tick; true = in the pass it was scanned
    externalChangeTicks: 3  # valid ticks an external change must persist before the book pauses
    readoptAfterBlocks: 240  # fleet only: matching blocks before a paused book re-adopts
    tickSeconds: 30  # assessment period, seconds
    tickHeartbeat: 20  # a tick row is written at least every this many ticks
    maxStalenessBlocks: 90  # the book does not act when the lens lags by more than this
